name: DripVision Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: dripvision-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/ghc /usr/local/share/boost || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          echo "After cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Inject env + API keys
        run: |
          mkdir -p assets
          cat > assets/.env << ENVFILE
          OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}
          FAL_AI_KEY=${{ secrets.FAL_AI_KEY }}
          OPENAI_KEY=${{ secrets.OPENAI_KEY }}
          ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}
          SUNO_API_KEY=${{ secrets.SUNO_API_KEY }}
          REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }}
          REVENUECAT_IOS_KEY=${{ secrets.REVENUECAT_IOS_KEY }}
          ENVFILE
          cp assets/.env .env

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        continue-on-error: true
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --directory build/web

      # Optional Android debug APK (non-blocking)
      - name: Verify google-services.json
        continue-on-error: true
        run: |
          test -f android/app/google-services.json || true
          python3 -c "import json; print(json.load(open('android/app/google-services.json'))['project_info']['project_id'])" || true

      - name: Build debug APK (arm64 only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          flutter build apk --debug --target-platform android-arm64 || true
          ls -lh build/app/outputs/flutter-apk/app-debug.apk || true

      - name: Upload APK artifact
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dripvision-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 2

  push-fix:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Fix splash screen navigation
        run: |
          cat > lib/views/screens/splash_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          import '../../core/theme.dart';
          import 'auth_screen.dart';

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});

            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> with TickerProviderStateMixin {
            late AnimationController _progressController;
            late AnimationController _fadeController;
            late AnimationController _scaleController;

            late Animation<double> _progress;
            late Animation<double> _fade;
            late Animation<double> _scale;

            @override
            void initState() {
              super.initState();

              _progressController = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 3),
              );
              _fadeController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 1200),
              );
              _scaleController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 1000),
              );

              _progress = Tween<double>(begin: 0, end: 1).animate(
                CurvedAnimation(parent: _progressController, curve: Curves.easeInOut),
              );
              _fade = Tween<double>(begin: 0, end: 1).animate(
                CurvedAnimation(parent: _fadeController, curve: Curves.easeOut),
              );
              _scale = Tween<double>(begin: 0.85, end: 1).animate(
                CurvedAnimation(parent: _scaleController, curve: Curves.easeOutBack),
              );

              _fadeController.forward();
              _scaleController.forward();
              _progressController.forward().then((_) {
                if (mounted) {
                  Navigator.of(context).pushReplacement(
                    MaterialPageRoute(builder: (_) => const AuthScreen()),
                  );
                }
              });
            }

            @override
            void dispose() {
              _progressController.dispose();
              _fadeController.dispose();
              _scaleController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: DripTheme.voidBlack,
                body: Center(
                  child: AnimatedBuilder(
                    animation: Listenable.merge([_fade, _scale, _progress]),
                    builder: (context, child) {
                      return Opacity(
                        opacity: _fade.value,
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            Transform.scale(
                              scale: _scale.value,
                              child: Container(
                                width: 120,
                                height: 120,
                                decoration: BoxDecoration(
                                  shape: BoxShape.circle,
                                  border: Border.all(color: DripTheme.teal, width: 2),
                                ),
                                child: const Center(
                                  child: Text(
                                    'DV',
                                    style: TextStyle(
                                      fontSize: 42,
                                      fontWeight: FontWeight.w700,
                                      color: DripTheme.teal,
                                      letterSpacing: 2,
                                    ),
                                  ),
                                ),
                              ),
                            ),
                            const SizedBox(height: 24),
                            const Text(
                              'DRIPVISION',
                              style: TextStyle(
                                fontSize: 28,
                                fontWeight: FontWeight.w700,
                                letterSpacing: 4,
                              ),
                            ),
                            const SizedBox(height: 8),
                            Text(
                              'An AI filmmaking studio',
                              style: DripTheme.meta,
                            ),
                            const SizedBox(height: 48),
                            SizedBox(
                              width: 180,
                              child: LinearProgressIndicator(
                                value: _progress.value,
                                backgroundColor: DripTheme.gunmetal,
                                color: DripTheme.teal,
                                minHeight: 3,
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  ),
                ),
              );
            }
          }
          EOF

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/views/screens/splash_screen.dart
          git diff --staged --quiet || git commit -m "fix: navigate splash to existing AuthScreen so web build succeeds"
          git push