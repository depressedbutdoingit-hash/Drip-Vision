name: DripVision Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: dripvision-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          sudo docker system prune -af || true

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get

      - name: Inject env
        run: |
          mkdir -p assets
          cat > assets/.env << ENVFILE
          OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}
          FAL_AI_KEY=${{ secrets.FAL_AI_KEY }}
          OPENAI_KEY=${{ secrets.OPENAI_KEY }}
          ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}
          SUNO_API_KEY=${{ secrets.SUNO_API_KEY }}
          ENVFILE

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --directory build/web

  push-fix:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Replace splash with simple version
        run: |
          cat > lib/views/screens/splash_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          import '../../core/theme.dart';
          import 'auth_screen.dart';

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});

            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> with TickerProviderStateMixin {
            late AnimationController _progressController;
            late AnimationController _fadeController;
            late AnimationController _scaleController;

            late Animation<double> _progress;
            late Animation<double> _fade;
            late Animation<double> _scale;

            @override
            void initState() {
              super.initState();