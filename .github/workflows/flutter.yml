name: DripVision Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create CI env file
        run: echo "REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }}" >> .env
        run: |
          touch .env
          echo "OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}" >> .env
          echo "FAL_AI_KEY=${{ secrets.FAL_AI_KEY }}" >> .env
          echo "OPENAI_KEY=${{ secrets.OPENAI_KEY }}" >> .env
          echo "ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}" >> .env
          echo "SUNO_API_KEY=${{ secrets.SUNO_API_KEY }}" >> .env
          echo "REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }}" >> .env

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create CI env file
        run: echo "REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }}" >> .env

      - name: Create placeholder google-services.json
        run: |
          cat > android/app/google-services.json << 'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dripvision-ci-placeholder",
              "storage_bucket": "dripvision-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.dripvision.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyForCIOnly000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
      - name: Restore missing Flutter Android files
        run: |
          TMP_DIR=$(mktemp -d)

          flutter create \
            --platforms=android \
            --org com.dripvision \
            "$TMP_DIR/dripvision"

          mkdir -p android/app/src/main
          cp -R "$TMP_DIR/dripvision/android/app/src/main/res" \
            android/app/src/main/

          mkdir -p android/app/src/main/kotlin/com/dripvision/app
          cat > android/app/src/main/kotlin/com/dripvision/app/MainActivity.kt <<'EOF'
          package com.dripvision.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF

          echo "Flutter Android resources restored:"
          find android/app/src/main/res -type f | sort
          echo "MainActivity restored:"
          cat android/app/src/main/kotlin/com/dripvision/app/MainActivity.kt

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dripvision-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
