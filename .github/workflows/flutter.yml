name: DripVision Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: dripvision-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          sudo docker system prune -af || true

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get

      - name: Inject env
        run: |
          mkdir -p assets
          cat > assets/.env << ENVFILE
          OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}
          FAL_AI_KEY=${{ secrets.FAL_AI_KEY }}
          OPENAI_KEY=${{ secrets.OPENAI_KEY }}
          ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}
          SUNO_API_KEY=${{ secrets.SUNO_API_KEY }}
          ENVFILE

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: dripvision-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  push-fix:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Write core fixes + ad generator + hub
        run: |
          python3 << 'PY'
          # 1. Real main.dart
          open('lib/main.dart', 'w').write(r'''import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'services/crashlytics_service.dart';
          import 'views/screens/splash_screen.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await Firebase.initializeApp();
              await CrashlyticsService.init();
            } catch (e, st) {
              debugPrint('Firebase/Crashlytics init failed: $e\n$st');
            }
            runApp(const ProviderScope(child: DripVisionApp()));
          }

          class DripVisionApp extends StatelessWidget {
            const DripVisionApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'DripVision',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF121416),
                  primaryColor: const Color(0xFF00FFAA),
                ),
                locale: const Locale('en'),
                supportedLocales: const [Locale('en'), Locale('es')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                home: const SplashScreen(),
              );
            }
          }
          ''')

          # 2. Real providers
          open('lib/core/app_providers.dart', 'w').write(r'''import 'package:flutter_riverpod/flutter_riverpod.dart';
          import '../models/style_dna.dart';
          import '../models/scene.dart';
          import '../models/character.dart';

          class StyleListNotifier extends StateNotifier<List<StyleDna>> {
            StyleListNotifier() : super([]);
            void addStyle(StyleDna s) => state = [...state, s];
            void updateStyle(StyleDna s) => state = [for (final x in state) if (x.id == s.id) s else x];
            void removeStyle(String id) => state = state.where((x) => x.id != id).toList();
            void duplicateStyle(String id) {
              final o = state.where((x) => x.id == id).firstOrNull;
              if (o == null) return;
              state = [...state, o.copyWith(id: 'style_\( {DateTime.now().millisecondsSinceEpoch}', name: ' \){o.name} (copy)', createdAt: DateTime.now())];
            }
          }
          final styleListProvider = StateNotifierProvider<StyleListNotifier, List<StyleDna>>((ref) => StyleListNotifier());
          final activeStyleProvider = StateProvider<StyleDna?>((ref) => null);

          class SceneListNotifier extends StateNotifier<List<SceneNode>> {
            SceneListNotifier() : super([]);
            void addScene(SceneNode s) => state = [...state, s];
            void updateScene(SceneNode s) => state = [for (final x in state) if (x.id == s.id) s else x];
            void removeScene(String id) => state = state.where((x) => x.id != id).toList();
            void duplicateScene(String id) {
              final o = state.where((x) => x.id == id).firstOrNull;
              if (o == null) return;
              state = [...state, o.copyWith(id: DateTime.now().millisecondsSinceEpoch.toString(), sequenceIndex: state.length)];
            }
            void reorder(int oldIndex, int newIndex) {
              if (newIndex > oldIndex) newIndex -= 1;
              final list = [...state];
              final item = list.removeAt(oldIndex);
              list.insert(newIndex, item);
              state = list;
            }
          }
          final sceneListProvider = StateNotifierProvider<SceneListNotifier, List<SceneNode>>((ref) => SceneListNotifier());

          class CharacterListNotifier extends StateNotifier<List<Character>> {
            CharacterListNotifier() : super([]);
            void addCharacter(Character c) => state = [...state, c];
            void updateCharacter(Character c) => state = [for (final x in state) if (x.id == c.id) c else x];
            void removeCharacter(String id) => state = state.where((x) => x.id != id).toList();
          }
          final characterListProvider = StateNotifierProvider<CharacterListNotifier, List<Character>>((ref) => CharacterListNotifier());
          final activeCharacterProvider = StateProvider<Character?>((ref) => null);
          final userProfileProvider = StateProvider<dynamic>((ref) => null);
          final navIndexProvider = StateProvider<int>((ref) => 0);
          final universeProvider = StateProvider<dynamic>((ref) => null);
          final filmBibleProvider = StateProvider<dynamic>((ref) => null);
          final pendingScenePromptProvider = StateProvider<String>((ref) => '');
          final musicPlayerProvider = StateProvider<dynamic>((ref) => null);
          ''')

          # 3. Auth provider
          open('lib/core/auth_providers.dart', 'w').write(r'''import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import '../services/auth_service.dart';
          final authServiceProvider = Provider<AuthService>((ref) => AuthService(FirebaseAuth.instance));
          ''')

          # 4. Hub screen
          open('lib/views/screens/app_hub_screen.dart', 'w').write(r'''import 'package:flutter/material.dart';
          import 'auth_screen.dart';
          import 'ad_generator_screen.dart';
          import 'studio_screen.dart';
          import 'timeline_screen.dart';
          import 'style_dna_screen.dart';

          class AppHubScreen extends StatelessWidget {
            const AppHubScreen({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF121416),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const SizedBox(height: 24),
                        const Text('DRIPVISION', style: TextStyle(fontSize: 28, fontWeight: FontWeight.w800, letterSpacing: 4, color: Color(0xFF00FFAA))),
                        const SizedBox(height: 8),
                        const Text('AI Filmmaking Studio', style: TextStyle(color: Colors.white70)),
                        const SizedBox(height: 40),
                        _btn(context, 'ENTER STUDIO', () => Navigator.push(context, MaterialPageRoute(builder: (_) => const AuthScreen()))),
                        const SizedBox(height: 12),
                        _btn(context, 'AD GENERATOR', () => Navigator.push(context, MaterialPageRoute(builder: (_) => const AdGeneratorScreen())), outline: true),
                        const SizedBox(height: 12),
                        _btn(context, 'TIMELINE', () => Navigator.push(context, MaterialPageRoute(builder: (_) => const TimelineScreen())), outline: true),
                        const SizedBox(height: 12),
                        _btn(context, 'STYLE DNA', () => Navigator.push(context, MaterialPageRoute(builder: (_) => const StyleDnaScreen())), outline: true),
                        const SizedBox(height: 12),
                        _btn(context, 'STUDIO', () => Navigator.push(context, MaterialPageRoute(builder: (_) => const DripVisionStudioScreen())), outline: true),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _btn(BuildContext context, String label, VoidCallback onTap, {bool outline = false}) {
              return SizedBox(
                width: double.infinity,
                child: outline
                    ? OutlinedButton(
                        style: OutlinedButton.styleFrom(side: const BorderSide(color: Color(0xFF00FFAA)), foregroundColor: const Color(0xFF00FFAA), padding: const EdgeInsets.symmetric(vertical: 16)),
                        onPressed: onTap,
                        child: Text(label),
                      )
                    : ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF00FFAA), foregroundColor: Colors.black, padding: const EdgeInsets.symmetric(vertical: 16)),
                        onPressed: onTap,
                        child: Text(label),
                      ),
              );
            }
          }
          ''')

          # 5. Ad Generator (script + image)
          open('lib/views/screens/ad_generator_screen.dart', 'w').write(r'''import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import '../../core/providers.dart';

          class AdGeneratorScreen extends ConsumerStatefulWidget {
            const AdGeneratorScreen({super.key});
            @override
            ConsumerState<AdGeneratorScreen> createState() => _AdGeneratorScreenState();
          }

          class _AdGeneratorScreenState extends ConsumerState<AdGeneratorScreen> {
            final _product = TextEditingController();
            final _benefit = TextEditingController();
            final _audience = TextEditingController();
            bool _loading = false;
            String? _script;
            String? _imageUrl;
            String? _error;

            @override
            void dispose() {
              _product.dispose();
              _benefit.dispose();
              _audience.dispose();
              super.dispose();
            }

            Future<void> _generate() async {
              final product = _product.text.trim();
              if (product.isEmpty) return;
              setState(() { _loading = true; _error = null; _script = null; _imageUrl = null; });
              try {
                final openRouter = ref.read(openRouterProvider);
                final ai = ref.read(aiGenerationServiceProvider);
                final prompt = 'Write a short 15-30s ad script for "$product". Benefit: ${_benefit.text.trim().isEmpty ? "premium quality" : _benefit.text.trim()}. Audience: ${_audience.text.trim().isEmpty ? "general" : _audience.text.trim()}. Include hook, problem, solution, CTA.';
                final script = await openRouter.generateText(prompt);
                final imagePrompt = 'Cinematic product ad photo of $product, professional lighting, high end commercial photography, ${_benefit.text.trim()}';
                final image = await ai.generateImage(prompt: imagePrompt, quality: 'standard');
                setState(() { _script = script; _imageUrl = image; });
              } catch (e) {
                setState(() => _error = e.toString());
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF121416),
                appBar: AppBar(title: const Text('AD GENERATOR'), backgroundColor: Colors.transparent),
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text('Product', style: TextStyle(color: Colors.white70)),
                        TextField(controller: _product, style: const TextStyle(color: Colors.white), decoration: const InputDecoration(hintText: 'e.g. Wireless earbuds')),
                        const SizedBox(height: 12),
                        const Text('Key benefit', style: TextStyle(color: Colors.white70)),
                        TextField(controller: _benefit, style: const TextStyle(color: Colors.white)),
                        const SizedBox(height: 12),
                        const Text('Audience', style: TextStyle(color: Colors.white70)),
                        TextField(controller: _audience, style: const TextStyle(color: Colors.white)),
                        const SizedBox(height: 20),
                        SizedBox(
                          width: double.infinity,
                          child: ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF00FFAA), foregroundColor: Colors.black, padding: const EdgeInsets.symmetric(vertical: 16)),
                            onPressed: _loading ? null : _generate,
                            child: _loading ? const SizedBox(width: 20, height: 20, child: CircularProgressIndicator(strokeWidth: 2)) : const Text('GENERATE AD'),
                          ),
                        ),
                        if (_error != null) ...[const SizedBox(height: 16), Text(_error!, style: const TextStyle(color: Colors.redAccent))],
                        if (_imageUrl != null) ...[
                          const SizedBox(height: 20),
                          Image.network(_imageUrl!, height: 200, fit: BoxFit.cover, errorBuilder: (_, __, ___) => const Text('Image failed to load', style: TextStyle(color: Colors.white54))),
                        ],
                        if (_script != null) ...[
                          const SizedBox(height: 16),
                          const Text('Script', style: TextStyle(color: Color(0xFF00FFAA), fontWeight: FontWeight.bold)),
                          const SizedBox(height: 8),
                          Container(
                            width: double.infinity,
                            padding: const EdgeInsets.all(12),
                            decoration: BoxDecoration(color: const Color(0xFF1A1F24), borderRadius: BorderRadius.circular(8)),
                            child: Text(_script!, style: const TextStyle(color: Colors.white, height: 1.4)),
                          ),
                        ],
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          ''')

          # 6. Point splash at the hub
          import pathlib
          p = pathlib.Path('lib/views/screens/splash_screen.dart')
          if p.exists():
              c = p.read_text()
              c = c.replace('const AuthScreen()', 'const AppHubScreen()')
              if "import 'app_hub_screen.dart';" not in c:
                  c = c.replace("import 'auth_screen.dart';", "import 'auth_screen.dart';\nimport 'app_hub_screen.dart';")
              p.write_text(c)
          print('Wrote all fixes')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix: real entry, Notifiers, Ad Generator with image, hub navigation, deploy" || echo "Nothing to commit"
          git push origin HEAD:main
          echo "Done"