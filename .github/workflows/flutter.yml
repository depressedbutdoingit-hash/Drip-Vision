name: DripVision Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: dripvision-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/ghc /usr/local/share/boost || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          echo "After cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Inject env + API keys
        run: |
          mkdir -p assets
          cat > assets/.env << ENVFILE
          OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}
          FAL_AI_KEY=${{ secrets.FAL_AI_KEY }}
          OPENAI_KEY=${{ secrets.OPENAI_KEY }}
          ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}
          SUNO_API_KEY=${{ secrets.SUNO_API_KEY }}
          REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }}
          REVENUECAT_IOS_KEY=${{ secrets.REVENUECAT_IOS_KEY }}
          ENVFILE
          cp assets/.env .env

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web
          retention-days: 1

      # Optional: Deploy directly to Cloudflare from Actions
      # Uncomment and add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets
      # - name: Deploy to Cloudflare Workers
      #   uses: cloudflare/wrangler-action@v3
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     command: deploy --directory build/web

      # Keep your existing Android debug APK steps below if you still want them
      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json
          python3 -c "import json; print(json.load(open('android/app/google-services.json'))['project_info']['project_id'])"

      - name: Ensure Android shell files
        run: |
          mkdir -p android/app/src/main/kotlin/com/dripvision/app
          if [ ! -f android/app/src/main/kotlin/com/dripvision/app/MainActivity.kt ]; then
            cat > android/app/src/main/kotlin/com/dripvision/app/MainActivity.kt <<'KTEOF'
          package com.dripvision.app
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity : FlutterActivity()
          KTEOF
          fi
          if [ ! -d android/app/src/main/res/mipmap-hdpi ]; then
            TMP_DIR=$(mktemp -d)
            flutter create --platforms=android --org com.dripvision "$TMP_DIR/dripvision"
            mkdir -p android/app/src/main
            cp -R "$TMP_DIR/dripvision/android/app/src/main/res" android/app/src/main/
            rm -rf "$TMP_DIR"
          fi

      - name: Build debug APK (arm64 only)
        run: |
          flutter build apk --debug --target-platform android-arm64
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          df -h

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dripvision-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 2

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-latest
          name: Debug APK (latest)
          body: |
            Auto-built debug APK from `${{ github.sha }}`.
            Install on Android (arm64). Allow install from unknown sources.
          files: build/app/outputs/flutter-apk/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true