name: DripVision Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create CI env file
        run: |
          touch .env
          echo "OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}" >> .env
          echo "FAL_AI_KEY=${{ secrets.FAL_AI_KEY }}" >> .env
          echo "OPENAI_KEY=${{ secrets.OPENAI_KEY }}" >> .env
          echo "ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}" >> .env
          echo "SUNO_API_KEY=${{ secrets.SUNO_API_KEY }}" >> .env

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  android-release-check:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create CI env file
        run: touch .env

      - name: Build Android APK (debug)
        run: flutter build apk --debug
        continue-on-error: true
