name: DripVision Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel older runs on the same branch so they don't fill the disk together.
concurrency:
  group: dripvision-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single job = one Flutter install, less disk pressure than analyze + build on two VMs.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/ghc /usr/local/share/boost || true
          sudo docker system prune -af || true
          # Keep only what we need; clear large caches
          sudo apt-get clean || true
          echo "After cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Inject env + API keys
        run: |
          mkdir -p assets
          cat > assets/.env << ENVFILE
          OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}
          FAL_AI_KEY=${{ secrets.FAL_AI_KEY }}
          OPENAI_KEY=${{ secrets.OPENAI_KEY }}
          ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}
          SUNO_API_KEY=${{ secrets.SUNO_API_KEY }}
          REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }}
          REVENUECAT_IOS_KEY=${{ secrets.REVENUECAT_IOS_KEY }}
          ENVFILE
          cp assets/.env .env

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test || true

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json
          python3 -c "import json; print(json.load(open('android/app/google-services.json'))['project_info']['project_id'])"

      - name: Ensure Android shell files
        run: |
          mkdir -p android/app/src/main/kotlin/com/dripvision/app
          if [ ! -f android/app/src/main/kotlin/com/dripvision/app/MainActivity.kt ]; then
            cat > android/app/src/main/kotlin/com/dripvision/app/MainActivity.kt <<'KTEOF'
          package com.dripvision.app
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity : FlutterActivity()
          KTEOF
          fi
          # Only scaffold res if missing (avoid full flutter create — saves GBs)
          if [ ! -d android/app/src/main/res/mipmap-hdpi ]; then
            TMP_DIR=$(mktemp -d)
            flutter create --platforms=android --org com.dripvision "$TMP_DIR/dripvision"
            mkdir -p android/app/src/main
            cp -R "$TMP_DIR/dripvision/android/app/src/main/res" android/app/src/main/
            rm -rf "$TMP_DIR"
          fi

      - name: Build debug APK (arm64 only)
        run: |
          # One ABI = far less native disk use (ffmpeg_kit is huge)
          flutter build apk --debug --target-platform android-arm64
          df -h

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dripvision-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
