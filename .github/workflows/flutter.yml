name: DripVision Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: dripvision-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          sudo docker system prune -af || true

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get

      - name: Inject env
        run: |
          mkdir -p assets
          cat > assets/.env << ENVFILE
          OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}
          FAL_AI_KEY=${{ secrets.FAL_AI_KEY }}
          OPENAI_KEY=${{ secrets.OPENAI_KEY }}
          ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}
          SUNO_API_KEY=${{ secrets.SUNO_API_KEY }}
          ENVFILE

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --directory build/web

  push-fix:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Write fancy splash with drips
        run: |
          cat > lib/views/screens/splash_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          import '../../core/theme.dart';
          import 'auth_screen.dart';

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});

            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> with TickerProviderStateMixin {
            late AnimationController _progressController;
            late AnimationController _fadeController;
            late AnimationController _scaleController;
            late AnimationController _glowController;
            late AnimationController _dripController;

            late Animation<double> _progress;
            late Animation<double> _fade;
            late Animation<double> _scale;
            late Animation<double> _glow;

            @override
            void initState() {
              super.initState();

              _progressController = AnimationController(vsync: this, duration: const Duration(seconds: 3));
              _fadeController = AnimationController(vsync: this, duration: const Duration(milliseconds: 1400));
              _scaleController = AnimationController(vsync: this, duration: const Duration(milliseconds: 1200));
              _glowController = AnimationController(vsync: this, duration: const Duration(milliseconds: 1800))..repeat(reverse: true);
              _dripController = AnimationController(vsync: this, duration: const Duration(milliseconds: 2200))..repeat();

              _progress = Tween<double>(begin: 0, end: 1).animate(
                CurvedAnimation(parent: _progressController, curve: Curves.easeInOutCubic),
              );
              _fade = Tween<double>(begin: 0, end: 1).animate(
                CurvedAnimation(parent: _fadeController, curve: Curves.easeOut),
              );
              _scale = Tween<double>(begin: 0.7, end: 1).animate(
                CurvedAnimation(parent: _scaleController, curve: Curves.elasticOut),
              );
              _glow = Tween<double>(begin: 0.3, end: 1).animate(
                CurvedAnimation(parent: _glowController, curve: Curves.easeInOut),
              );

              _fadeController.forward();
              _scaleController.forward();
              _progressController.forward().then((_) {
                if (mounted) {
                  Navigator.of(context).pushReplacement(
                    PageRouteBuilder(
                      pageBuilder: (_, __, ___) => const AuthScreen(),
                      transitionsBuilder: (_, animation, __, child) {
                        return FadeTransition(opacity: animation, child: child);
                      },
                      transitionDuration: const Duration(milliseconds: 600),
                    ),
                  );
                }
              });
            }

            @override
            void dispose() {
              _progressController.dispose();
              _fadeController.dispose();
              _scaleController.dispose();
              _glowController.dispose();
              _dripController.dispose();
              super.dispose();
            }

            Widget _buildDrip({required double delay, required double left}) {
              return AnimatedBuilder(
                animation: _dripController,
                builder: (context, child) {
                  final t = (_dripController.value + delay) % 1.0;
                  final opacity = t < 0.15 ? t / 0.15 : (1 - t) * 1.2;
                  final scaleY = 0.4 + t * 1.1;
                  return Positioned(
                    left: left,
                    top: 70 + t * 28,
                    child: Opacity(
                      opacity: opacity.clamp(0.0, 1.0),
                      child: Transform.scale(
                        scaleY: scaleY,
                        child: Container(
                          width: 6,
                          height: 18,
                          decoration: BoxDecoration(
                            borderRadius: BorderRadius.circular(3),
                            color: DripTheme.teal,
                            boxShadow: [
                              BoxShadow(
                                color: DripTheme.teal.withOpacity(0.7),
                                blurRadius: 8,
                                spreadRadius: 1,
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: DripTheme.voidBlack,
                body: Center(
                  child: AnimatedBuilder(
                    animation: Listenable.merge([_fade, _scale, _progress, _glow]),
                    builder: (context, child) {
                      return Opacity(
                        opacity: _fade.value,
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            SizedBox(
                              width: 160,
                              height: 160,
                              child: Stack(
                                alignment: Alignment.center,
                                children: [
                                  Transform.scale(
                                    scale: _scale.value,
                                    child: Container(
                                      width: 140,
                                      height: 140,
                                      decoration: BoxDecoration(
                                        shape: BoxShape.circle,
                                        border: Border.all(
                                          color: DripTheme.teal.withOpacity(_glow.value),
                                          width: 3,
                                        ),
                                        boxShadow: [
                                          BoxShadow(
                                            color: DripTheme.teal.withOpacity(0.4 * _glow.value),
                                            blurRadius: 30,
                                            spreadRadius: 4,
                                          ),
                                        ],
                                      ),
                                      child: const Center(
                                        child: Text(
                                          'DV',
                                          style: TextStyle(
                                            fontSize: 48,
                                            fontWeight: FontWeight.w800,
                                            color: DripTheme.teal,
                                            letterSpacing: 4,
                                          ),
                                        ),
                                      ),
                                    ),
                                  ),
                                  _buildDrip(delay: 0.0, left: 48),
                                  _buildDrip(delay: 0.33, left: 72),
                                  _buildDrip(delay: 0.66, left: 96),
                                ],
                              ),
                            ),
                            const SizedBox(height: 32),
                            const Text(
                              'DRIPVISION',
                              style: TextStyle(
                                fontSize: 32,
                                fontWeight: FontWeight.w800,
                                letterSpacing: 6,
                                color: Colors.white,
                              ),
                            ),
                            const SizedBox(height: 8),
                            Text(
                              'AI Filmmaking Studio',
                              style: DripTheme.meta.copyWith(fontSize: 16),
                            ),
                            const SizedBox(height: 48),
                            SizedBox(
                              width: 200,
                              child: LinearProgressIndicator(
                                value: _progress.value,
                                backgroundColor: DripTheme.gunmetal,
                                color: DripTheme.teal,
                                minHeight: 4,
                                borderRadius: BorderRadius.circular(4),
                              ),
                            ),
                            const SizedBox(height: 12),
                            Text(
                              '${(_progress.value * 100).toInt()}%',
                              style: TextStyle(
                                color: DripTheme.teal.withOpacity(0.8),
                                fontSize: 12,
                                fontWeight: FontWeight.w500,
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  ),
                ),
              );
            }
          }
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/views/screens/splash_screen.dart
          git status
          git commit -m "feat: fancy splash with glowing drip animations" || echo "Nothing to commit"
          git push origin HEAD:main
          echo "Push complete"