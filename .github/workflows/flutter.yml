name: DripVision Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: dripvision-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          sudo docker system prune -af || true

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get

      - name: Inject env
        run: |
          mkdir -p assets
          cat > assets/.env << ENVFILE
          OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}
          FAL_AI_KEY=${{ secrets.FAL_AI_KEY }}
          OPENAI_KEY=${{ secrets.OPENAI_KEY }}
          ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}
          SUNO_API_KEY=${{ secrets.SUNO_API_KEY }}
          ENVFILE

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --directory build/web

  push-fix:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Write real providers
        run: |
          python3 << 'PY'
          # Service providers
          providers = '''import 'package:flutter_riverpod/flutter_riverpod.dart';

          import '../services/media_action_service.dart';
          import '../services/style_dna_service.dart';
          import '../services/suno_service.dart';
          import '../services/ai_director_service.dart';
          import '../services/token_service.dart';
          import '../services/openrouter_service.dart';
          import '../services/video_stitching_service.dart';
          import '../services/ai_generation_service.dart';
          import '../services/continuity_service.dart';
          import 'env.dart';

          final mediaActionProvider = Provider<MediaActionService>((ref) => MediaActionService());
          final styleDnaServiceProvider = Provider<StyleDnaService>((ref) => StyleDnaService(Env.openRouterKey));
          final sunoServiceProvider = Provider<SunoService>((ref) => SunoService(Env.openRouterKey));
          final aiDirectorServiceProvider = Provider<AIDirectorService>((ref) => AIDirectorService());
          final tokenServiceProvider = Provider<TokenService>((ref) => TokenService());
          final openRouterProvider = Provider<OpenRouterService>((ref) => OpenRouterService());
          final videoStitchProvider = Provider<VideoStitchingService>((ref) => VideoStitchingService());
          final aiGenerationServiceProvider = Provider<AIGenerationService>((ref) => AIGenerationService());
          final continuityServiceProvider = Provider<ContinuityEngine>((ref) => ContinuityEngine());
          '''
          open('lib/core/providers.dart', 'w').write(providers)

          # Real auth provider
          auth = '''import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import '../services/auth_service.dart';

          final authServiceProvider = Provider<AuthService>((ref) {
            return AuthService(FirebaseAuth.instance);
          });
          '''
          open('lib/core/auth_providers.dart', 'w').write(auth)

          # Common screen state providers
          app = '''import 'package:flutter_riverpod/flutter_riverpod.dart';

          final sceneListProvider = StateProvider<List<dynamic>>((ref) => []);
          final characterListProvider = StateProvider<List<dynamic>>((ref) => []);
          final userProfileProvider = StateProvider<dynamic>((ref) => null);
          final navIndexProvider = StateProvider<int>((ref) => 0);
          final activeCharacterProvider = StateProvider<dynamic>((ref) => null);
          final universeProvider = StateProvider<dynamic>((ref) => null);
          final filmBibleProvider = StateProvider<dynamic>((ref) => null);
          final pendingScenePromptProvider = StateProvider<String>((ref) => '');
          final styleListProvider = StateProvider<List<dynamic>>((ref) => []);
          final activeStyleProvider = StateProvider<dynamic>((ref) => null);
          final musicPlayerProvider = StateProvider<dynamic>((ref) => null);
          '''
          open('lib/core/app_providers.dart', 'w').write(app)
          print('Wrote provider files')
          PY

      - name: Add imports to screens
        run: |
          python3 << 'PY'
          import os

          files = [
            'lib/views/screens/storyboard_screen.dart',
            'lib/views/screens/studio_screen.dart',
            'lib/views/screens/music_video_screen.dart',
            'lib/views/screens/profile_screen.dart',
            'lib/views/screens/settings_screen.dart',
            'lib/views/screens/sound_department_screen.dart',
            'lib/views/screens/story_pipeline_screen.dart',
            'lib/views/screens/story_planner_screen.dart',
            'lib/views/screens/style_dna_screen.dart',
            'lib/views/screens/timeline_screen.dart',
            'lib/views/widgets/cosmic_stats_overlay.dart',
            'lib/views/widgets/studio_drawer.dart',
            'lib/views/screens/auth_screen.dart',
          ]

          import_line = "import '../../core/app_providers.dart';\n"
          auth_import = "import '../../core/auth_providers.dart';\n"

          for path in files:
            if not os.path.exists(path):
              continue
            with open(path, 'r') as f:
              content = f.read()
            lines = content.splitlines(keepends=True)
            last_import = 0
            for i, line in enumerate(lines):
              if line.startswith('import '):
                last_import = i
            changed = False
            if 'app_providers.dart' not in content:
              lines.insert(last_import + 1, import_line)
              changed = True
            if path.endswith('auth_screen.dart') and 'auth_providers.dart' not in content:
              lines.insert(last_import + 1, auth_import)
              changed = True
            if changed:
              with open(path, 'w') as f:
                f.writelines(lines)
              print(f'Updated imports in {path}')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix: real providers + imports so screens compile" || echo "Nothing to commit"
          git push origin HEAD:main
          echo "Push complete"